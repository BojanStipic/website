name: "CI"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "pnpm/setup@v3"
        with:
          cache: true
      - run: "pnpm run lint:check"
  format:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "pnpm/setup@v3"
        with:
          cache: true
      - run: "pnpm run fmt:check"
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "pnpm/setup@v3"
        with:
          cache: true
      - run: "pnpm run build"
